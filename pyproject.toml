[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-project-intelligence"
version = "0.1.0"
description = "Private project-intelligence system for a personal homelab: Discord commands, read-only evidence-backed reporting, local Ollama analysis, and controlled research. Private by design."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.urls]
Repository = "https://github.com/Human-prog/Discord-Intel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
