[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-project-intelligence"
version = "0.1.0"
description = "Private project-intelligence system for a personal homelab: Discord commands, read-only evidence-backed reporting, local Ollama analysis, and controlled research. Private by design."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=9,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Human-prog/Discord-Intel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["project_intelligence"]
branch = true

[tool.coverage.report]
show_missing = true
# Actual coverage is 100% branch coverage as of Phase 3; the gate allows a
# small buffer for platform-specific branches added in later phases.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "DTZ", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["project_intelligence"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use credential-shaped strings and non-loopback bind values
# ("0.0.0.0", "::") as inputs that must be rejected or handled.
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# src/ and scripts/ require full signatures; test functions may omit
# parameter/return annotations per pytest convention, but their bodies
# are still type-checked (check_untyped_defs stays enabled above).
module = "tests.*"
disallow_untyped_defs = false
