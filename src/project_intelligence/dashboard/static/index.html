<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f14">
<title>Project Intelligence</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #121820;
    --surface-2: #182230;
    --border: #24303f;
    --text: #e8eef6;
    --muted: #93a3b5;
    --accent: #7c9cff;
    --accent-ink: #0b0f14;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --unknown: #94a3b8;
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --border: #dbe3ec;
      --text: #101722;
      --muted: #5b6b7c;
      --accent: #3556d8;
      --accent-ink: #ffffff;
      --ok: #15803d;
      --warn: #a16207;
      --bad: #b91c1c;
      --unknown: #64748b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  .app { max-width: 680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
  .mark {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    display: grid; place-items: center;
    background: linear-gradient(140deg, var(--accent), #b78cff);
    color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .5px;
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack { display: grid; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; text-transform: lowercase;
    border: 1px solid transparent; white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill-healthy { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .pill-stale { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .pill-unhealthy { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .pill-unknown, .pill-open { color: var(--unknown); background: color-mix(in srgb, var(--unknown) 12%, transparent); border-color: color-mix(in srgb, var(--unknown) 30%, transparent); }
  .pill-in_progress { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .pill-completed, .pill-active { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .pill-idle, .pill-pending { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .pill-dormant, .pill-failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .pill-high { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .pill-medium { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .pill-low, .pill-agent, .pill-idea { color: var(--muted); background: var(--surface-2); border-color: var(--border); }
  .project {
    display: block; width: 100%; text-align: left;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    font: inherit; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .project:active { transform: scale(.99); border-color: var(--accent); }
  .project .name { font-weight: 650; font-size: 16px; margin-bottom: 2px; }
  .project .root { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity { display: grid; gap: 12px; }
  .activity-item { display: grid; gap: 2px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .activity-item .who { font-size: 12px; color: var(--muted); }
  button, input { font: inherit; }
  .btn {
    min-height: 46px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity: .55; cursor: default; }
  .field { display: grid; gap: 8px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field input {
    width: 100%; min-height: 48px; padding: 0 14px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px;
  }
  .field input:focus, .btn:focus-visible, .project:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .banner {
    border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
    font-size: 14px; border: 1px solid;
  }
  .banner-error { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .banner-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 0; color: var(--accent);
    font: inherit; font-weight: 600; padding: 8px 0; margin-bottom: 8px; cursor: pointer;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    font-size: 12px; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 999px;
  }
  .detail-title { font-size: 22px; margin: 2px 0 4px; letter-spacing: -0.02em; }
  .list-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .list-item:first-child { padding-top: 0; }
  .list-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .list-item .title { font-weight: 600; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .list-item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hash { overflow-wrap: anywhere; }
  .header-actions { display: flex; gap: 8px; }
  .tabs { display: flex; gap: 8px; margin: -6px 0 16px; }
  .tab {
    flex: 1; min-height: 42px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--surface-2); color: var(--text); border-color: var(--accent); }
  .icon-btn {
    width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 16px;
  }
  .report {
    white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 14px; line-height: 1.55;
  }
  .source { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .source:last-child { border-bottom: 0; padding-bottom: 0; }
  .source a { color: var(--accent); overflow-wrap: anywhere; }
  .source .snippet { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .project-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .loading { color: var(--muted); padding: 24px 4px; }
  .footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 22px; }
  @media (min-width: 560px) {
    body { padding-top: 32px; }
    .brand h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<main id="app" class="app" aria-live="polite"></main>
<noscript><p style="padding:16px">JavaScript is required to use the dashboard.</p></noscript>
<script>
(() => {
  "use strict";

  const app = document.getElementById("app");
  const state = { projectId: null, health: null, view: "projects", researchId: null };

  // ---------- tiny DOM helpers ----------
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === null || value === undefined) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
      else if (key === "dataset") Object.assign(node.dataset, value);
      else if (value === true) node.setAttribute(key, "");
      else if (value !== false) node.setAttribute(key, value);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function clear() { app.replaceChildren(); }

  function banner(message, kind = "error") {
    return el("div", { class: `banner banner-${kind}`, role: kind === "error" ? "alert" : "status" }, message);
  }

  function loading(message = "Loading…") {
    clear();
    app.append(brand(), el("div", { class: "loading" }, message));
  }

  // ---------- API ----------
  async function api(path, options = {}) {
    const init = { credentials: "same-origin", ...options };
    init.headers = { Accept: "application/json", ...(options.headers || {}) };
    if (options.body && !init.headers["Content-Type"]) init.headers["Content-Type"] = "application/json";
    const response = await fetch(path, init);
    if (response.status === 401) {
      const error = new Error("unauthorized");
      error.unauthorized = true;
      throw error;
    }
    if (!response.ok) {
      let detail = "";
      try {
        const data = await response.json();
        detail = data.detail || data.message || "";
      } catch (_) { /* non-JSON error body */ }
      throw new Error(detail || `Request failed (${response.status})`);
    }
    if (response.status === 204) return null;
    return response.json();
  }

  // ---------- formatting ----------
  function parseIso(value) {
    if (!value) return null;
    let text = String(value).trim().replace(/Z$/, "");
    const fraction = text.match(/\.(\d+)/);
    if (fraction) text = text.replace(`.${fraction[1]}`, `.${fraction[1].slice(0, 3)}`);
    const date = new Date(text);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function timeAgo(value) {
    const date = parseIso(value);
    if (!date) return "unknown";
    const seconds = Math.round((Date.now() - date.getTime()) / 1000);
    if (seconds < 45) return "just now";
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    if (days < 30) return `${days}d ago`;
    return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function fmtDate(value) {
    const date = parseIso(value);
    return date ? date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "no date";
  }

  function fmtUptime(seconds) {
    if (typeof seconds !== "number") return "—";
    const s = Math.max(0, Math.round(seconds));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`;
  }

  function statusPill(status) {
    const safe = ["healthy", "stale", "unhealthy", "unknown"].includes(status) ? status : "unknown";
    return el("span", { class: `pill pill-${safe}` }, safe);
  }

  function milestonePill(status) {
    const safe = ["open", "in_progress", "completed"].includes(status) ? status : "open";
    return el("span", { class: `pill pill-${safe}` }, safe.replace("_", " "));
  }

  function catalogPill(status) {
    if (!status) return "";
    const safe = ["active", "idle", "dormant", "archived"].includes(status) ? status : "unknown";
    return el("span", { class: `pill pill-${safe}` }, status);
  }

  function priorityPill(priority) {
    if (!priority) return "";
    const safe = ["high", "medium", "low", "agent", "idea"].includes(priority) ? priority : "unknown";
    return el("span", { class: `pill pill-${safe}` }, priority);
  }

  function researchPill(status) {
    const safe = ["completed", "failed", "pending", "running"].includes(status) ? status : "unknown";
    return el("span", { class: `pill pill-${safe}` }, status);
  }

  function safeUrl(value) {
    try {
      const url = new URL(value);
      return ["http:", "https:"].includes(url.protocol) ? url.href : null;
    } catch (_) {
      return null;
    }
  }

  function techChips(items) {
    return (items || []).map((tech) => el("span", { class: "chip" }, tech));
  }

  // ---------- chrome ----------
  function brand() {
    return el("header", { class: "brand" },
      el("div", { class: "mark", "aria-hidden": "true" }, "DPI"),
      el("div", null,
        el("h1", null, "Project Intelligence"),
        el("p", null, "Private dashboard")
      )
    );
  }

  function navTabs() {
    return el("nav", { class: "tabs", "aria-label": "Sections" },
      el("button", {
        class: state.view === "projects" ? "tab active" : "tab", type: "button",
        onclick: () => { if (state.view !== "projects") showHome(); },
      }, "Projects"),
      el("button", {
        class: state.view === "research" ? "tab active" : "tab", type: "button",
        onclick: () => { if (state.view !== "research") showResearchList(); },
      }, "Research")
    );
  }

  function headerActions(showRefresh = true) {
    const actions = el("div", { class: "header-actions" });
    if (showRefresh) {
      actions.append(el("button", {
        class: "icon-btn", type: "button", title: "Refresh", "aria-label": "Refresh",
        onclick: () => {
          if (state.view === "research") {
            state.researchId ? showResearchDetail(state.researchId) : showResearchList();
          } else {
            state.projectId ? showProject(state.projectId) : showHome();
          }
        },
      }, "↻"));
    }
    actions.append(el("button", {
      class: "icon-btn", type: "button", title: "Sign out", "aria-label": "Sign out",
      onclick: logout,
    }, "⏻"));
    return actions;
  }

  async function logout() {
    try { await api("/auth/logout", { method: "POST" }); } catch (_) { /* cookie cleared best-effort */ }
    state.projectId = null;
    state.researchId = null;
    showLogin();
  }

  // ---------- login ----------
  function showLogin(message = "") {
    clear();
    const input = el("input", {
      id: "owner-token", name: "token", type: "password",
      autocomplete: "current-password", autocapitalize: "none",
      spellcheck: "false", required: true,
      placeholder: "Dashboard session secret",
    });
    const submit = el("button", { class: "btn btn-primary", type: "submit" }, "Sign in");
    const errorBox = el("div", { id: "login-error" });

    const form = el("form", {
      class: "field",
      onsubmit: async (event) => {
        event.preventDefault();
        errorBox.replaceChildren();
        submit.disabled = true;
        submit.textContent = "Signing in…";
        try {
          await api("/auth/session", {
            method: "POST",
            body: JSON.stringify({ token: input.value.trim() }),
          });
          input.value = "";
          routeFromHash();
        } catch (error) {
          errorBox.replaceChildren(banner(error.unauthorized ? "That token was not accepted." : error.message));
          submit.disabled = false;
          submit.textContent = "Sign in";
          input.focus();
        }
      },
    },
      el("label", { for: "owner-token" }, "Owner secret"),
      input,
      submit
    );

    app.append(
      brand(),
      message ? banner(message, "ok") : "",
      el("section", { class: "card" },
        el("h2", null, "Sign in"),
        el("p", { class: "small muted", style: "margin-top:0" },
          "Paste the dashboard session secret from the server file (/etc/dpi/session_secret). ",
          "It is exchanged once for a signed, HttpOnly session cookie."
        ),
        form,
        errorBox
      ),
      el("p", { class: "footer" }, "Tailnet-only · no public exposure")
    );
    input.focus();
  }

  // ---------- home ----------
  async function showHome() {
    loading();
    state.projectId = null;
    state.researchId = null;
    state.view = "projects";
    history.replaceState(null, "", location.pathname);
    try {
      const [health, projects, activity, catalog, research] = await Promise.all([
        api("/health"),
        api("/projects?per_page=100"),
        api("/activity/recent?per_page=6"),
        api("/catalog/summary"),
        api("/research?per_page=5"),
      ]);
      state.health = health;
      renderHome(health, projects, activity, catalog, research);
    } catch (error) {
      handleError(error, showHome);
    }
  }

  function renderHome(health, projects, activity, catalog, research) {
    clear();
    const dbOk = health.database_healthy !== false;

    const healthCard = el("section", { class: "card" },
      el("h2", null, "Status"),
      el("div", { class: "row" },
        el("div", { class: "stack" },
          el("div", { class: "row", style: "justify-content:flex-start;gap:8px" },
            el("span", { class: `pill ${dbOk ? "pill-healthy" : "pill-unhealthy"}` }, dbOk ? "database ok" : "database error"),
            el("span", { class: "chip" }, health.app_env || "unknown"),
            el("span", { class: `chip` }, health.research_configured ? "web research ready" : "local research only")
          ),
          el("div", { class: "small muted" },
            `up ${fmtUptime(health.uptime_seconds)} · ${health.dashboard_bound_host}:${health.dashboard_bound_port}`
          )
        ),
        headerActions()
      )
    );

    const catalogCard = el("section", { class: "card" },
      el("h2", null, "Catalog"),
      el("div", { class: "meta", style: "margin-top:0" },
        el("span", { class: "chip" }, `${catalog.project_count} projects`),
        el("span", { class: "chip" }, `${catalog.active_count} active`),
        el("span", { class: "chip" }, `${catalog.work_item_count} work items`),
        el("span", { class: "chip" }, `${catalog.research_job_count} research jobs`)
      ),
      el("div", { class: "small muted", style: "margin-top:10px" },
        catalog.last_import_at_utc
          ? `Catalog imported ${timeAgo(catalog.last_import_at_utc)} · ${catalog.monitored_count} monitored`
          : "No workstation catalog imported yet."
      )
    );

    const projectList = el("section", { class: "stack" });
    if (!projects.length) {
      projectList.append(el("section", { class: "card" },
        el("h2", null, "Projects"),
        el("p", { class: "empty", style: "margin:0" },
          "No projects are registered yet. Import the workstation catalog or connect one through Discord.")
      ));
    } else {
      for (const project of projects) {
        projectList.append(el("button", {
          class: "project", type: "button",
          onclick: () => showProject(project.id),
        },
          el("div", { class: "row" },
            el("div", { style: "min-width:0" },
              el("div", { class: "name" }, project.name),
              el("div", { class: "root mono" }, project.allowed_root)
            ),
            statusPill(project.status)
          ),
          el("div", { class: "project-meta" },
            catalogPill(project.catalog_status),
            priorityPill(project.priority),
            project.monitored === false ? el("span", { class: "chip" }, "catalog only") : "",
            el("span", { class: "chip" }, `${project.work_item_count || 0} work`),
            project.last_activity_utc ? el("span", { class: "chip" }, `active ${timeAgo(project.last_activity_utc)}`) : ""
          )
        ));
      }
    }

    const researchCard = el("section", { class: "card" },
      el("div", { class: "row" },
        el("h2", { style: "margin:0" }, "Recent research"),
        el("button", { class: "btn btn-ghost", type: "button", style: "min-height:34px;padding:0 10px", onclick: showResearchList }, "View all")
      ),
      research.length
        ? el("div", { style: "margin-top:12px" }, research.map((job) =>
            el("button", {
              class: "project", type: "button", style: "margin-bottom:8px",
              onclick: () => showResearchDetail(job.id),
            },
              el("div", { class: "row" },
                el("div", { style: "min-width:0;text-align:left" },
                  el("div", { class: "name", style: "font-size:14px" }, job.question),
                  el("div", { class: "root" }, `${job.scope} · ${job.source_count} sources · ${timeAgo(job.started_at_utc)}`)
                ),
                researchPill(job.status)
              )
            )
          ))
        : el("p", { class: "empty", style: "margin:12px 0 0" }, "No research yet. Use /research in Discord.")
    );

    const activityCard = el("section", { class: "card" },
      el("h2", null, "Recent activity"),
      activity.length
        ? el("div", { class: "activity" }, activity.map((entry) =>
            el("div", { class: "activity-item" },
              el("div", null, entry.title || "(no content)"),
              el("div", { class: "who" }, `${entry.actor || "system"} · ${timeAgo(entry.occurred_at_utc)}`)
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No activity yet.")
    );

    app.append(brand(), navTabs(), healthCard, catalogCard, projectList, researchCard, activityCard,
      el("p", { class: "footer" }, "All data is read-only except milestone writes from Discord."));
  }

  // ---------- research list ----------
  async function showResearchList() {
    loading();
    state.view = "research";
    state.projectId = null;
    state.researchId = null;
    history.replaceState(null, "", location.pathname);
    try {
      const [catalog, jobs] = await Promise.all([
        api("/catalog/summary"),
        api("/research?per_page=100"),
      ]);
      renderResearchList(catalog, jobs);
    } catch (error) {
      handleError(error, showResearchList);
    }
  }

  function renderResearchList(catalog, jobs) {
    clear();
    const list = jobs.length
      ? el("div", null, jobs.map((job) =>
          el("button", {
            class: "project", type: "button",
            onclick: () => showResearchDetail(job.id),
          },
            el("div", { class: "row" },
              el("div", { style: "min-width:0;text-align:left" },
                el("div", { class: "name" }, job.question),
                el("div", { class: "root" },
                  `${job.project_name || "workspace"} · ${job.scope} · ${timeAgo(job.started_at_utc)}`)
              ),
              researchPill(job.status)
            ),
            el("div", { class: "project-meta" },
              el("span", { class: "chip" }, `${job.source_count} sources`),
              job.provider ? el("span", { class: "chip" }, job.provider) : "",
              job.result_summary ? el("span", { class: "chip" }, job.result_summary) : ""
            )
          )
        ))
      : el("section", { class: "card" },
          el("p", { class: "empty", style: "margin:0" },
            "No research jobs yet. Ask in Discord with /research, then refresh."));

    app.append(
      brand(),
      navTabs(),
      el("section", { class: "card" },
        el("h2", null, "Research"),
        el("p", { class: "small muted", style: "margin:0" },
          `${catalog.research_job_count} jobs · local knowledge and cited web sources. ` +
          (catalog.research_job_count ? "Tap a job to read the full report." : "")
        )
      ),
      list,
      el("p", { class: "footer" }, "Research reports are private to this dashboard.")
    );
  }

  // ---------- research detail ----------
  async function showResearchDetail(jobId) {
    loading();
    state.view = "research";
    state.researchId = jobId;
    state.projectId = null;
    history.replaceState(null, "", `#research-${jobId}`);
    try {
      const job = await api(`/research/${jobId}`);
      renderResearchDetail(job);
    } catch (error) {
      handleError(error, () => showResearchDetail(jobId));
    }
  }

  function renderResearchDetail(job) {
    clear();
    const back = el("button", { class: "back", type: "button", onclick: showResearchList }, "← All research");
    const sourceList = job.sources && job.sources.length
      ? el("div", null, job.sources.map((source) => {
          const href = source.url ? safeUrl(source.url) : null;
          return el("div", { class: "source" },
            el("div", { class: "title" },
              el("span", null, source.title),
              source.relevance_score ? el("span", { class: "chip" }, `score ${Number(source.relevance_score).toFixed(2)}`) : ""
            ),
            href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, source.url) : "",
            source.snippet ? el("div", { class: "snippet" }, source.snippet) : "",
            el("div", { class: "sub mono" }, `${source.source_type}${source.source_ref ? ` · ${source.source_ref}` : ""}`)
          );
        }))
      : el("p", { class: "empty", style: "margin:0" }, "No sources were stored for this job.");

    app.append(
      brand(),
      navTabs(),
      back,
      el("section", { class: "card" },
        el("div", { class: "row" },
          el("div", { style: "min-width:0" },
            el("h2", { style: "margin-bottom:4px" }, "Research"),
            el("div", { class: "detail-title", style: "font-size:19px" }, job.question)
          ),
          researchPill(job.status)
        ),
        el("div", { class: "meta" },
          el("span", { class: "chip" }, job.project_name || "workspace"),
          el("span", { class: "chip" }, job.scope),
          el("span", { class: "chip" }, `${job.source_count} sources`),
          job.provider ? el("span", { class: "chip" }, job.provider) : "",
          el("span", { class: "chip" }, timeAgo(job.started_at_utc))
        ),
        job.error ? banner(job.error) : ""
      ),
      el("section", { class: "card" },
        el("h2", null, "Report"),
        job.report_text
          ? el("div", { class: "report" }, job.report_text)
          : el("p", { class: "empty", style: "margin:0" },
              job.status === "failed" ? "This job failed before producing a report." : "No report stored yet.")
      ),
      el("section", { class: "card" },
        el("h2", null, "Sources"),
        sourceList
      ),
      el("p", { class: "footer" },
        `started ${fmtDate(job.started_at_utc)}` +
        (job.completed_at_utc ? ` · completed ${timeAgo(job.completed_at_utc)}` : ""))
    );
  }

  // ---------- project detail ----------
  async function showProject(projectId) {
    loading();
    state.projectId = projectId;
    state.view = "projects";
    state.researchId = null;
    history.replaceState(null, "", `#project-${projectId}`);
    try {
      const [project, milestones, evidence] = await Promise.all([
        api(`/projects/${projectId}`),
        api(`/projects/${projectId}/milestones`),
        api(`/projects/${projectId}/evidence?per_page=25`),
      ]);
      renderProject(project, milestones, evidence);
    } catch (error) {
      handleError(error, () => showProject(projectId));
    }
  }

  function renderProject(project, milestones, evidence) {
    clear();

    const back = el("button", { class: "back", type: "button", onclick: showHome }, "← All projects");
    const repoHref = project.repo_url ? safeUrl(project.repo_url) : null;

    const detail = el("section", { class: "card" },
      el("div", { class: "row" },
        el("div", { style: "min-width:0" },
          el("h2", { style: "margin-bottom:4px" }, "Project"),
          el("div", { class: "detail-title" }, project.name)
        ),
        statusPill(project.status)
      ),
      project.description ? el("p", { class: "small muted", style: "margin:6px 0 0" }, project.description) : "",
      el("div", { class: "meta" },
        catalogPill(project.catalog_status),
        priorityPill(project.priority),
        project.monitored === false ? el("span", { class: "chip" }, "catalog only") : "",
        el("span", { class: "chip" }, `${project.milestone_count} milestones`),
        el("span", { class: "chip" }, `${project.evidence_count} evidence`),
        el("span", { class: "chip" }, `${project.work_item_count} work items`),
        el("span", { class: "chip" }, `${project.research_count} research`),
        el("span", { class: "chip" }, `${project.discord_mappings} mappings`),
        el("span", { class: "chip" }, `health ${project.health_freshness}`)
      ),
      el("div", { class: "meta" }, techChips(project.tech_stack)),
      repoHref ? el("p", { class: "small", style: "margin:10px 0 0" },
        el("a", { href: repoHref, target: "_blank", rel: "noopener noreferrer" }, project.repo_url)) : "",
      el("p", { class: "mono muted", style: "margin:12px 0 0" }, project.allowed_root),
      project.local_path && project.local_path !== project.allowed_root
        ? el("p", { class: "mono muted", style: "margin:4px 0 0" }, project.local_path) : "",
      project.monitored === false
        ? el("p", { class: "small muted", style: "margin:10px 0 0" },
            "Catalog-only: this project lives on the workstation, so server-side health checks are skipped.")
        : ""
    );

    const workCard = el("section", { class: "card" },
      el("h2", null, "Recent work"),
      project.recent_work && project.recent_work.length
        ? el("div", null, project.recent_work.map((item) =>
            el("div", { class: "list-item" },
              el("div", { class: "title" },
                el("span", null, item.title),
                el("span", { class: "chip" }, item.status)
              ),
              el("div", { class: "sub" },
                `${item.work_type} · ${item.source} · ${timeAgo(item.occurred_at_utc)}`)
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No work items recorded yet.")
    );

    const researchCard = el("section", { class: "card" },
      el("h2", null, "Research"),
      project.recent_research && project.recent_research.length
        ? el("div", null, project.recent_research.map((job) =>
            el("button", {
              class: "project", type: "button", style: "margin-bottom:8px",
              onclick: () => showResearchDetail(job.id),
            },
              el("div", { class: "row" },
                el("div", { style: "min-width:0;text-align:left" },
                  el("div", { class: "name", style: "font-size:14px" }, job.question),
                  el("div", { class: "root" }, `${job.source_count} sources · ${timeAgo(job.started_at_utc)}`)
                ),
                researchPill(job.status)
              )
            )
          ))
        : el("p", { class: "empty", style: "margin:0" },
            "No research yet. Use /research in this project's Discord channel.")
    );

    const milestoneCard = el("section", { class: "card" },
      el("h2", null, "Milestones"),
      milestones.length
        ? el("div", null, milestones.map((milestone) =>
            el("div", { class: "list-item" },
              el("div", { class: "title" },
                el("span", null, milestone.title),
                milestonePill(milestone.status)
              ),
              el("div", { class: "sub" },
                milestone.target_date ? `target ${fmtDate(milestone.target_date)}` : "no target date")
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No milestones yet.")
    );

    const evidenceCard = el("section", { class: "card" },
      el("h2", null, "Evidence"),
      evidence.length
        ? el("div", null, evidence.map((item) =>
            el("div", { class: "list-item" },
              el("div", { class: "title" },
                el("span", null, item.title),
                item.is_stale ? el("span", { class: "pill pill-stale" }, "stale") : ""
              ),
              el("div", { class: "sub" },
                `confidence ${Math.round((item.confidence || 0) * 100)}% · retrieved ${timeAgo(item.retrieved_at_utc)}`
              ),
              el("div", { class: "sub mono hash" }, `sha256:${String(item.content_hash || "").slice(0, 16)}…`)
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No evidence records yet.")
    );

    app.append(brand(), navTabs(), back, detail, workCard, researchCard, milestoneCard, evidenceCard,
      el("p", { class: "footer" }, `created ${fmtDate(project.created_at_utc)} · updated ${timeAgo(project.updated_at_utc)}`));
  }

  // ---------- error handling ----------
  function handleError(error, retry) {
    clear();
    app.append(brand());
    if (error.unauthorized) {
      showLogin("Your session expired — sign in again.");
      return;
    }
    app.append(
      banner(error.message || "Something went wrong."),
      el("button", { class: "btn", type: "button", onclick: retry }, "Try again")
    );
  }

  // ---------- boot ----------
  function routeFromHash() {
    const researchMatch = /^#research-(\d+)$/.exec(location.hash);
    if (researchMatch) {
      showResearchDetail(Number(researchMatch[1]));
      return;
    }
    const projectMatch = /^#project-(\d+)$/.exec(location.hash);
    if (projectMatch) {
      showProject(Number(projectMatch[1]));
      return;
    }
    showHome();
  }

  async function boot() {
    try {
      const session = await api("/auth/session");
      if (session.authenticated) routeFromHash();
      else showLogin();
    } catch (_) {
      showLogin();
    }
  }

  window.addEventListener("hashchange", routeFromHash);
  boot();
})();
</script>
</body>
</html>
