<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f14">
<title>Project Intelligence</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #121820;
    --surface-2: #182230;
    --border: #24303f;
    --text: #e8eef6;
    --muted: #93a3b5;
    --accent: #7c9cff;
    --accent-ink: #0b0f14;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --unknown: #94a3b8;
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --border: #dbe3ec;
      --text: #101722;
      --muted: #5b6b7c;
      --accent: #3556d8;
      --accent-ink: #ffffff;
      --ok: #15803d;
      --warn: #a16207;
      --bad: #b91c1c;
      --unknown: #64748b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  .app { max-width: 680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
  .mark {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    display: grid; place-items: center;
    background: linear-gradient(140deg, var(--accent), #b78cff);
    color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .5px;
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack { display: grid; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; text-transform: lowercase;
    border: 1px solid transparent; white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill-healthy { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .pill-stale { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .pill-unhealthy { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .pill-unknown, .pill-open { color: var(--unknown); background: color-mix(in srgb, var(--unknown) 12%, transparent); border-color: color-mix(in srgb, var(--unknown) 30%, transparent); }
  .pill-in_progress { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .pill-completed { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .project {
    display: block; width: 100%; text-align: left;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    font: inherit; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .project:active { transform: scale(.99); border-color: var(--accent); }
  .project .name { font-weight: 650; font-size: 16px; margin-bottom: 2px; }
  .project .root { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity { display: grid; gap: 12px; }
  .activity-item { display: grid; gap: 2px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .activity-item .who { font-size: 12px; color: var(--muted); }
  button, input { font: inherit; }
  .btn {
    min-height: 46px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity: .55; cursor: default; }
  .field { display: grid; gap: 8px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field input {
    width: 100%; min-height: 48px; padding: 0 14px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px;
  }
  .field input:focus, .btn:focus-visible, .project:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .banner {
    border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
    font-size: 14px; border: 1px solid;
  }
  .banner-error { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .banner-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 0; color: var(--accent);
    font: inherit; font-weight: 600; padding: 8px 0; margin-bottom: 8px; cursor: pointer;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    font-size: 12px; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 999px;
  }
  .detail-title { font-size: 22px; margin: 2px 0 4px; letter-spacing: -0.02em; }
  .list-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .list-item:first-child { padding-top: 0; }
  .list-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .list-item .title { font-weight: 600; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .list-item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .hash { overflow-wrap: anywhere; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 16px;
  }
  .loading { color: var(--muted); padding: 24px 4px; }
  .footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 22px; }
  @media (min-width: 560px) {
    body { padding-top: 32px; }
    .brand h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<main id="app" class="app" aria-live="polite"></main>
<noscript><p style="padding:16px">JavaScript is required to use the dashboard.</p></noscript>
<script>
(() => {
  "use strict";

  const app = document.getElementById("app");
  const state = { projectId: null, health: null };

  // ---------- tiny DOM helpers ----------
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === null || value === undefined) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
      else if (key === "dataset") Object.assign(node.dataset, value);
      else if (value === true) node.setAttribute(key, "");
      else if (value !== false) node.setAttribute(key, value);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function clear() { app.replaceChildren(); }

  function banner(message, kind = "error") {
    return el("div", { class: `banner banner-${kind}`, role: kind === "error" ? "alert" : "status" }, message);
  }

  function loading(message = "Loading…") {
    clear();
    app.append(brand(), el("div", { class: "loading" }, message));
  }

  // ---------- API ----------
  async function api(path, options = {}) {
    const init = { credentials: "same-origin", ...options };
    init.headers = { Accept: "application/json", ...(options.headers || {}) };
    if (options.body && !init.headers["Content-Type"]) init.headers["Content-Type"] = "application/json";
    const response = await fetch(path, init);
    if (response.status === 401) {
      const error = new Error("unauthorized");
      error.unauthorized = true;
      throw error;
    }
    if (!response.ok) {
      let detail = "";
      try {
        const data = await response.json();
        detail = data.detail || data.message || "";
      } catch (_) { /* non-JSON error body */ }
      throw new Error(detail || `Request failed (${response.status})`);
    }
    if (response.status === 204) return null;
    return response.json();
  }

  // ---------- formatting ----------
  function parseIso(value) {
    if (!value) return null;
    let text = String(value).trim().replace(/Z$/, "");
    const fraction = text.match(/\.(\d+)/);
    if (fraction) text = text.replace(`.${fraction[1]}`, `.${fraction[1].slice(0, 3)}`);
    const date = new Date(text);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function timeAgo(value) {
    const date = parseIso(value);
    if (!date) return "unknown";
    const seconds = Math.round((Date.now() - date.getTime()) / 1000);
    if (seconds < 45) return "just now";
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    if (days < 30) return `${days}d ago`;
    return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function fmtDate(value) {
    const date = parseIso(value);
    return date ? date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "no date";
  }

  function fmtUptime(seconds) {
    if (typeof seconds !== "number") return "—";
    const s = Math.max(0, Math.round(seconds));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`;
  }

  function statusPill(status) {
    const safe = ["healthy", "stale", "unhealthy", "unknown"].includes(status) ? status : "unknown";
    return el("span", { class: `pill pill-${safe}` }, safe);
  }

  function milestonePill(status) {
    const safe = ["open", "in_progress", "completed"].includes(status) ? status : "open";
    return el("span", { class: `pill pill-${safe}` }, safe.replace("_", " "));
  }

  // ---------- chrome ----------
  function brand() {
    return el("header", { class: "brand" },
      el("div", { class: "mark", "aria-hidden": "true" }, "DPI"),
      el("div", null,
        el("h1", null, "Project Intelligence"),
        el("p", null, "Private dashboard")
      )
    );
  }

  function headerActions(showRefresh = true) {
    const actions = el("div", { class: "header-actions" });
    if (showRefresh) {
      actions.append(el("button", {
        class: "icon-btn", type: "button", title: "Refresh", "aria-label": "Refresh",
        onclick: () => { state.projectId ? showProject(state.projectId) : showHome(); },
      }, "↻"));
    }
    actions.append(el("button", {
      class: "icon-btn", type: "button", title: "Sign out", "aria-label": "Sign out",
      onclick: logout,
    }, "⏻"));
    return actions;
  }

  async function logout() {
    try { await api("/auth/logout", { method: "POST" }); } catch (_) { /* cookie cleared best-effort */ }
    state.projectId = null;
    showLogin();
  }

  // ---------- login ----------
  function showLogin(message = "") {
    clear();
    const input = el("input", {
      id: "owner-token", name: "token", type: "password",
      autocomplete: "current-password", autocapitalize: "none",
      spellcheck: "false", required: true,
      placeholder: "Dashboard session secret",
    });
    const submit = el("button", { class: "btn btn-primary", type: "submit" }, "Sign in");
    const errorBox = el("div", { id: "login-error" });

    const form = el("form", {
      class: "field",
      onsubmit: async (event) => {
        event.preventDefault();
        errorBox.replaceChildren();
        submit.disabled = true;
        submit.textContent = "Signing in…";
        try {
          await api("/auth/session", {
            method: "POST",
            body: JSON.stringify({ token: input.value.trim() }),
          });
          input.value = "";
          showHome();
        } catch (error) {
          errorBox.replaceChildren(banner(error.unauthorized ? "That token was not accepted." : error.message));
          submit.disabled = false;
          submit.textContent = "Sign in";
          input.focus();
        }
      },
    },
      el("label", { for: "owner-token" }, "Owner secret"),
      input,
      submit
    );

    app.append(
      brand(),
      message ? banner(message, "ok") : "",
      el("section", { class: "card" },
        el("h2", null, "Sign in"),
        el("p", { class: "small muted", style: "margin-top:0" },
          "Paste the dashboard session secret from the server file (/etc/dpi/session_secret). ",
          "It is exchanged once for a signed, HttpOnly session cookie."
        ),
        form,
        errorBox
      ),
      el("p", { class: "footer" }, "Tailnet-only · no public exposure")
    );
    input.focus();
  }

  // ---------- home ----------
  async function showHome() {
    loading();
    state.projectId = null;
    try {
      const [health, projects, activity] = await Promise.all([
        api("/health"),
        api("/projects"),
        api("/activity/recent?per_page=10"),
      ]);
      state.health = health;
      renderHome(health, projects, activity);
    } catch (error) {
      handleError(error, showHome);
    }
  }

  function renderHome(health, projects, activity) {
    clear();
    const dbOk = health.database_healthy !== false;

    const healthCard = el("section", { class: "card" },
      el("h2", null, "Status"),
      el("div", { class: "row" },
        el("div", { class: "stack" },
          el("div", { class: "row", style: "justify-content:flex-start;gap:8px" },
            el("span", { class: `pill ${dbOk ? "pill-healthy" : "pill-unhealthy"}` }, dbOk ? "database ok" : "database error"),
            el("span", { class: "chip" }, health.app_env || "unknown")
          ),
          el("div", { class: "small muted" },
            `up ${fmtUptime(health.uptime_seconds)} · ${health.dashboard_bound_host}:${health.dashboard_bound_port}`
          )
        ),
        headerActions()
      )
    );

    const projectList = el("section", { class: "stack" });
    if (!projects.length) {
      projectList.append(el("section", { class: "card" },
        el("h2", null, "Projects"),
        el("p", { class: "empty", style: "margin:0" },
          "No projects are registered yet. Connect one through the Discord bot and refresh.")
      ));
    } else {
      for (const project of projects) {
        projectList.append(el("button", {
          class: "project", type: "button",
          onclick: () => showProject(project.id),
        },
          el("div", { class: "row" },
            el("div", { style: "min-width:0" },
              el("div", { class: "name" }, project.name),
              el("div", { class: "root mono" }, project.allowed_root)
            ),
            statusPill(project.status)
          ),
          el("div", { class: "small muted", style: "margin-top:8px" },
            `checked ${timeAgo(project.last_checked)}`)
        ));
      }
    }

    const activityCard = el("section", { class: "card" },
      el("h2", null, "Recent activity"),
      activity.length
        ? el("div", { class: "activity" }, activity.map((entry) =>
            el("div", { class: "activity-item" },
              el("div", null, entry.title || "(no content)"),
              el("div", { class: "who" }, `${entry.actor || "system"} · ${timeAgo(entry.occurred_at_utc)}`)
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No activity yet.")
    );

    app.append(brand(), healthCard, projectList, activityCard,
      el("p", { class: "footer" }, "All data is read-only except milestone writes from Discord."));
  }

  // ---------- project detail ----------
  async function showProject(projectId) {
    loading();
    state.projectId = projectId;
    try {
      const [project, milestones, evidence] = await Promise.all([
        api(`/projects/${projectId}`),
        api(`/projects/${projectId}/milestones`),
        api(`/projects/${projectId}/evidence?per_page=25`),
      ]);
      renderProject(project, milestones, evidence);
    } catch (error) {
      handleError(error, () => showProject(projectId));
    }
  }

  function renderProject(project, milestones, evidence) {
    clear();

    const back = el("button", { class: "back", type: "button", onclick: showHome }, "← All projects");

    const detail = el("section", { class: "card" },
      el("div", { class: "row" },
        el("div", { style: "min-width:0" },
          el("h2", { style: "margin-bottom:4px" }, "Project"),
          el("div", { class: "detail-title" }, project.name)
        ),
        statusPill(project.status)
      ),
      project.description ? el("p", { class: "small muted", style: "margin:6px 0 0" }, project.description) : "",
      el("div", { class: "meta" },
        el("span", { class: "chip" }, `${project.milestone_count} milestones`),
        el("span", { class: "chip" }, `${project.evidence_count} evidence`),
        el("span", { class: "chip" }, `${project.discord_mappings} mappings`),
        el("span", { class: "chip" }, `health ${project.health_freshness}`)
      ),
      el("p", { class: "mono muted", style: "margin:12px 0 0" }, project.allowed_root)
    );

    const milestoneCard = el("section", { class: "card" },
      el("h2", null, "Milestones"),
      milestones.length
        ? el("div", null, milestones.map((milestone) =>
            el("div", { class: "list-item" },
              el("div", { class: "title" },
                el("span", null, milestone.title),
                milestonePill(milestone.status)
              ),
              el("div", { class: "sub" },
                milestone.target_date ? `target ${fmtDate(milestone.target_date)}` : "no target date")
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No milestones yet.")
    );

    const evidenceCard = el("section", { class: "card" },
      el("h2", null, "Evidence"),
      evidence.length
        ? el("div", null, evidence.map((item) =>
            el("div", { class: "list-item" },
              el("div", { class: "title" },
                el("span", null, item.title),
                item.is_stale ? el("span", { class: "pill pill-stale" }, "stale") : ""
              ),
              el("div", { class: "sub" },
                `confidence ${Math.round((item.confidence || 0) * 100)}% · retrieved ${timeAgo(item.retrieved_at_utc)}`
              ),
              el("div", { class: "sub mono hash" }, `sha256:${String(item.content_hash || "").slice(0, 16)}…`)
            )
          ))
        : el("p", { class: "empty", style: "margin:0" }, "No evidence records yet.")
    );

    app.append(brand(), back, detail, milestoneCard, evidenceCard,
      el("p", { class: "footer" }, `created ${fmtDate(project.created_at_utc)} · updated ${timeAgo(project.updated_at_utc)}`));
  }

  // ---------- error handling ----------
  function handleError(error, retry) {
    clear();
    app.append(brand());
    if (error.unauthorized) {
      showLogin("Your session expired — sign in again.");
      return;
    }
    app.append(
      banner(error.message || "Something went wrong."),
      el("button", { class: "btn", type: "button", onclick: retry }, "Try again")
    );
  }

  // ---------- boot ----------
  async function boot() {
    try {
      const session = await api("/auth/session");
      if (session.authenticated) showHome();
      else showLogin();
    } catch (_) {
      showLogin();
    }
  }

  boot();
})();
</script>
</body>
</html>
